[project]
name = "aegis"
version = "0.1.0"
description = "Expert discovery and ranking engine for healthcare, biomedical research, and drug-discovery talent"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.25",
    "biopython>=1.83",
    "cutlet>=0.4",
    "httpx>=0.27",
    "pydantic>=2.6",
    "recordlinkage>=0.16",
    "duckdb>=0.10",
    "feedparser>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "prometheus-client>=0.20",
    "pyjwt>=2.8",
    "pyyaml>=6.0",
    "thefuzz>=0.22",
    "scipy>=1.12",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.9",
    "ruff>=0.3",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis"]

[tool.pytest.ini_options]
testpaths = ["src", "tests"]
pythonpath = ["src"]
addopts = "--tb=short -q"
asyncio_mode = "strict"

[tool.ruff]
src = ["src"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
