<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="system-ui, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="900" height="560" fill="#f8f9fa" rx="12"/>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" font-size="18" font-weight="600" fill="#1a1a2e">Aegis — Query Data Flow</text>

  <!-- Arrowhead markers -->
  <defs>
    <marker id="arrowD" markerWidth="8" markerHeight="8" refX="4" refY="6" orient="auto">
      <path d="M0,0 L6,0 L3,8 z" fill="#1a73e8"/>
    </marker>
    <marker id="arrowDG" markerWidth="8" markerHeight="8" refX="4" refY="6" orient="auto">
      <path d="M0,0 L6,0 L3,8 z" fill="#34a853"/>
    </marker>
    <marker id="arrowU" markerWidth="8" markerHeight="8" refX="4" refY="2" orient="auto">
      <path d="M0,8 L6,8 L3,0 z" fill="#34a853"/>
    </marker>
  </defs>

  <!-- ── STEP 1: Query Input ── -->
  <rect x="300" y="56" width="300" height="56" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
  <text x="450" y="80" text-anchor="middle" font-size="13" font-weight="600" fill="#1a73e8">1. Query Input</text>
  <text x="450" y="100" text-anchor="middle" font-size="11" fill="#555">Task description (free text) + population + K</text>

  <!-- Arrow 1→2 -->
  <line x1="450" y1="112" x2="450" y2="138" stroke="#1a73e8" stroke-width="2" marker-end="url(#arrowD)"/>

  <!-- ── STEP 2: LLM Query Expansion ── -->
  <rect x="300" y="138" width="300" height="60" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
  <text x="450" y="162" text-anchor="middle" font-size="13" font-weight="600" fill="#1a73e8">2. LLM Query Expansion</text>
  <text x="450" y="180" text-anchor="middle" font-size="11" fill="#555">MetaMap + constrained LLM → MeSH vector</text>
  <!-- Fallback note -->
  <rect x="620" y="148" width="140" height="24" rx="4" fill="#fff4e5" stroke="#f9ab00" stroke-width="1"/>
  <text x="690" y="164" text-anchor="middle" font-size="10" fill="#b06000">fallback: MetaMap-only</text>
  <line x1="600" y1="160" x2="620" y2="160" stroke="#f9ab00" stroke-width="1" stroke-dasharray="3 2"/>

  <!-- Arrow 2→3 -->
  <line x1="450" y1="198" x2="450" y2="224" stroke="#1a73e8" stroke-width="2" marker-end="url(#arrowD)"/>

  <!-- ── STEP 3: Candidate Retrieval ── -->
  <rect x="300" y="224" width="300" height="56" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
  <text x="450" y="248" text-anchor="middle" font-size="13" font-weight="600" fill="#1a73e8">3. Candidate Retrieval</text>
  <text x="450" y="268" text-anchor="middle" font-size="11" fill="#555">DuckDB lookup · population filter · cohort</text>

  <!-- Branch out to 3 parallel scoring boxes -->
  <line x1="450" y1="280" x2="450" y2="296" stroke="#1a73e8" stroke-width="2"/>
  <line x1="210" y1="296" x2="690" y2="296" stroke="#1a73e8" stroke-width="1.5"/>
  <line x1="210" y1="296" x2="210" y2="316" stroke="#1a73e8" stroke-width="1.5"/>
  <line x1="450" y1="296" x2="450" y2="316" stroke="#1a73e8" stroke-width="1.5"/>
  <line x1="690" y1="296" x2="690" y2="316" stroke="#1a73e8" stroke-width="1.5"/>

  <!-- ── 3 parallel scoring components ── -->
  <rect x="100" y="316" width="220" height="72" rx="8" fill="#fff" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="210" y="340" text-anchor="middle" font-size="12" font-weight="600" fill="#1a73e8">R — Recency</text>
  <text x="210" y="358" text-anchor="middle" font-size="10" fill="#555">Exponential decay on</text>
  <text x="210" y="374" text-anchor="middle" font-size="10" fill="#555">recent relevant work</text>

  <rect x="340" y="316" width="220" height="72" rx="8" fill="#fff" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="450" y="340" text-anchor="middle" font-size="12" font-weight="600" fill="#1a73e8">Q — Quality Prior</text>
  <text x="450" y="358" text-anchor="middle" font-size="10" fill="#555">F1–F7: citations, funding,</text>
  <text x="450" y="374" text-anchor="middle" font-size="10" fill="#555">leadership, lineage</text>

  <rect x="580" y="316" width="220" height="72" rx="8" fill="#fff" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="690" y="340" text-anchor="middle" font-size="12" font-weight="600" fill="#1a73e8">C — Topical Fit</text>
  <text x="690" y="358" text-anchor="middle" font-size="10" fill="#555">MeSH vector similarity</text>
  <text x="690" y="374" text-anchor="middle" font-size="10" fill="#555">query ↔ candidate portfolio</text>

  <!-- Converge lines -->
  <line x1="210" y1="388" x2="210" y2="408" stroke="#1a73e8" stroke-width="1.5"/>
  <line x1="450" y1="388" x2="450" y2="408" stroke="#1a73e8" stroke-width="1.5"/>
  <line x1="690" y1="388" x2="690" y2="408" stroke="#1a73e8" stroke-width="1.5"/>
  <line x1="210" y1="408" x2="690" y2="408" stroke="#1a73e8" stroke-width="1.5"/>
  <line x1="450" y1="408" x2="450" y2="424" stroke="#1a73e8" stroke-width="2" marker-end="url(#arrowD)"/>

  <!-- Weight formula -->
  <text x="450" y="420" text-anchor="middle" font-size="10" fill="#777">α·R + β·Q + γ·C  (weights learned per population via Plackett-Luce)</text>

  <!-- ── STEP 4: Integrity Gate ── -->
  <rect x="300" y="426" width="300" height="60" rx="8" fill="#fce8e6" stroke="#ea4335" stroke-width="2"/>
  <text x="450" y="450" text-anchor="middle" font-size="13" font-weight="600" fill="#c5221f">4. Integrity Gate  I(c)</text>
  <text x="450" y="470" text-anchor="middle" font-size="11" fill="#555">Hard zero · Soft discount · Retraction / ORI / OFAC</text>

  <!-- Arrow 4→5 -->
  <line x1="450" y1="486" x2="450" y2="508" stroke="#1a73e8" stroke-width="2" marker-end="url(#arrowD)"/>

  <!-- ── STEP 5: Ranked Results ── -->
  <rect x="300" y="508" width="300" height="40" rx="8" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
  <text x="450" y="526" text-anchor="middle" font-size="13" font-weight="600" fill="#137333">5. Ranked Results</text>
  <text x="450" y="542" text-anchor="middle" font-size="10" fill="#555">Scores · evidence trails · variance bands · provenance</text>

  <!-- Feedback loop arrow (right side, curved back up) -->
  <path d="M 600 528 Q 820 528 820 300 Q 820 80 620 68" fill="none" stroke="#34a853" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#arrowU)"/>
  <text x="840" y="295" font-size="10" fill="#137333" text-anchor="middle">Feedback</text>
  <text x="840" y="309" font-size="10" fill="#137333" text-anchor="middle">Loop</text>
  <text x="840" y="323" font-size="10" fill="#137333" text-anchor="middle">(weekly</text>
  <text x="840" y="337" font-size="10" fill="#137333" text-anchor="middle">weight</text>
  <text x="840" y="351" font-size="10" fill="#137333" text-anchor="middle">refit)</text>
</svg>
