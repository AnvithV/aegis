version: "3.9"
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    env_file:
      - .env
    environment:
      - AEGIS_DB_PATH=/app/data/aegis.duckdb
      - AEGIS_REFRESH_INTERVAL_HOURS=6
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - AEGIS_API_URL=http://backend:8000
      - AEGIS_API_TOKEN=${AEGIS_API_TOKEN}
    depends_on:
      backend:
        condition: service_healthy
