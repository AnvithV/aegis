groups:
  - name: aegis-api-health
    rules:
      - alert: AegisApiHighErrorRate
        expr: |
          (
            sum by (source) (rate(aegis_api_requests_total{status=~"http_5xx|timeout"}[5m]))
            /
            sum by (source) (rate(aegis_api_requests_total[5m]))
          ) > 0.10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High API error rate for {{ $labels.source }}"
          description: >-
            More than 10% of API requests to {{ $labels.source }}
            are failing with 5xx or timeout errors over the last 5 minutes.

      - alert: AegisApiRateLimited
        expr: |
          sum by (source) (increase(aegis_api_rate_limit_hits_total[5m])) > 10
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Rate limiting detected for {{ $labels.source }}"
          description: >-
            More than 10 rate-limit hits for {{ $labels.source }}
            in the last 5 minutes.

      - alert: AegisApiSchemaBreak
        expr: |
          sum by (source) (increase(aegis_api_parse_errors_total[1h])) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Schema/parse errors for {{ $labels.source }}"
          description: >-
            More than 5 parse errors for {{ $labels.source }}
            in the last hour, possible upstream schema change.

      - alert: AegisApiHighLatency
        expr: |
          histogram_quantile(0.95, rate(aegis_api_latency_seconds_bucket[5m])) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High API latency for {{ $labels.source }}"
          description: >-
            p95 API latency for {{ $labels.source }} exceeds 5 seconds.
